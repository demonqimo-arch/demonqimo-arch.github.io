name: Health Check

on:
  schedule:
    - cron: '7 * * * *' # 每小时一次（避开整点，减少GitHub那边排队延迟）
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: healthcheck
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      failed: ${{ steps.check.outputs.failed }}
    steps:
      - uses: actions/checkout@v4

      - name: 检测网站和 Worker 是否正常
        id: check
        run: |
          set +e
          SITE_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 25 "https://demonqimo-arch.github.io/")
          SITE_TIME=$(curl -s -o /dev/null -w "%{time_total}" --max-time 25 "https://demonqimo-arch.github.io/")
          # Worker 的 /login 用一个假PIN探测，预期返回401说明Worker本身是活的（不需要用到真实PIN）
          WORKER_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 25 -X POST "https://xingcheng-worker.3156400437.workers.dev/login" -H "Content-Type: application/json" -d '{"pin":"healthcheck-probe"}')
          WORKER_TIME=$(curl -s -o /dev/null -w "%{time_total}" --max-time 25 -X POST "https://xingcheng-worker.3156400437.workers.dev/login" -H "Content-Type: application/json" -d '{"pin":"healthcheck-probe"}')

          echo "site_code=$SITE_CODE" >> "$GITHUB_OUTPUT"
          echo "site_time=$SITE_TIME" >> "$GITHUB_OUTPUT"
          echo "worker_code=$WORKER_CODE" >> "$GITHUB_OUTPUT"
          echo "worker_time=$WORKER_TIME" >> "$GITHUB_OUTPUT"

          FAILED=0
          [ "$SITE_CODE" = "200" ] || FAILED=1
          [ "$WORKER_CODE" = "401" ] || FAILED=1
          echo "failed=$FAILED" >> "$GITHUB_OUTPUT"

      - name: 记录检测结果
        run: |
          mkdir -p .github/healthcheck
          TS=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          STATUS="OK"
          [ "${{ steps.check.outputs.failed }}" = "1" ] && STATUS="FAIL"
          echo "$TS | 网站:${{ steps.check.outputs.site_code }}(${{ steps.check.outputs.site_time }}s) | Worker:${{ steps.check.outputs.worker_code }}(${{ steps.check.outputs.worker_time }}s) | $STATUS" >> .github/healthcheck/log.txt
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/healthcheck/log.txt
          git commit -m "healthcheck: $TS ($STATUS)" || true
          git push

      - name: 检测失败时创建 Issue 记录（同一次故障期间只开一条，避免刷屏）
        if: steps.check.outputs.failed == '1'
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- healthcheck-failure -->'
            const { data: openIssues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
            })
            const existing = openIssues.find((i) => i.body && i.body.includes(marker))
            const timestamp = new Date().toISOString()
            const detail = [
              `- 网站 (https://demonqimo-arch.github.io/)：HTTP ${{ steps.check.outputs.site_code }}，耗时 ${{ steps.check.outputs.site_time }}s`,
              `- Cloudflare Worker：HTTP ${{ steps.check.outputs.worker_code }}（预期401），耗时 ${{ steps.check.outputs.worker_time }}s`,
            ].join('\n')

            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: `${timestamp} 仍然异常：\n${detail}`,
              })
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `健康检查失败 - ${timestamp}`,
                body: [
                  marker,
                  '自动健康检查发现异常：',
                  '',
                  detail,
                  '',
                  '常见原因：网络波动、或服务真的出了问题。',
                  '可以去 Actions 页面看这次运行的完整日志进一步排查。',
                  '',
                  '（同一次故障期间后续的失败会追加评论在这条 Issue 下面，不会重复开新的；恢复正常后请手动关闭这条 Issue，下次故障会重新开一条新的）',
                ].join('\n'),
              })
            }
