name: Keep Supabase Project Alive

on:
  schedule:
    - cron: '17 3 */3 * *' # 每3天一次，避开整点
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Query Supabase database to keep the project active
        run: |
          curl -sf "${{ secrets.VITE_SUPABASE_URL }}/rest/v1/tasks?select=id&limit=1" \
            -H "apikey: ${{ secrets.VITE_SUPABASE_ANON_KEY }}"

      - name: 记录一次保活时间戳，避免仓库因60天无提交被GitHub停用定时任务
        run: |
          mkdir -p .github/keepalive
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .github/keepalive/last-ping.txt
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/keepalive/last-ping.txt
          git diff --cached --quiet || git commit -m "chore: keepalive ping $(date -u +%Y-%m-%d)"
          git push
